<!DOCTYPE html>
<html>
<head>
    <title>Desafio 3</title>
    <style>
        body { font-family: Arial; text-align: center; margin-top: 50px; }
        #resultado { font-size: 24px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>

    <h1>Verificador de Idade</h1>
    <button onclick="verificarIdade()">Clique aqui</button>
    <p id="resultado"></p>

    <script>
        function verificarIdade() {
            let nome = prompt("Qual é o seu nome?");
            let idadeTexto = prompt("Qual é a sua idade?");
            let idade = Number(idadeTexto);
            
            if (idade >= 18) {
                document.getElementById("resultado").innerText = "Olá, " + nome + "! Você é maior de idade.";
                document.getElementById("resultado").style.color = "green";
            } else {
                document.getElementById("resultado").innerText = "Olá, " + nome + "! Você é menor de idade.";
                document.getElementById("resultado").style.color = "red";
            }
        }
    </script>

</body>
</html>
