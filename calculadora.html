<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Calculadora</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #2c3e50;
            margin: 0;
        }
        .calculadora {
            background-color: #34495e;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        #display {
            width: 100%;
            height: 60px;
            font-size: 32px;
            text-align: right;
            padding: 10px;
            margin-bottom: 15px;
            border: none;
            border-radius: 5px;
            background-color: #ecf0f1;
            box-sizing: border-box;
        }
        .botoes {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        button {
            padding: 20px;
            font-size: 20px;
            border: none;
            border-radius: 5px;
            background-color: #7f8c8d;
            color: white;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #95a5a6;
        }
        .igual {
            background-color: #27ae60;
        }
        .igual:hover {
            background-color: #2ecc71;
        }
        .limpar {
            background-color: #c0392b;
        }
        .limpar:hover {
            background-color: #e74c3c;
        }
    </style>
</head>
<body>

    <div class="calculadora">
        <input type="text" id="display" readonly>
        
        <div class="botoes">
            <button class="limpar" onclick="limpar()">C</button>
            <button onclick="apagar()">⌫</button>
            <button onclick="adicionar('%')">%</button>
            <button onclick="adicionar('/')">/</button>
            
            <button onclick="adicionar('7')">7</button>
            <button onclick="adicionar('8')">8</button>
            <button onclick="adicionar('9')">9</button>
            <button onclick="adicionar('*')">×</button>
            
            <button onclick="adicionar('4')">4</button>
            <button onclick="adicionar('5')">5</button>
            <button onclick="adicionar('6')">6</button>
            <button onclick="adicionar('-')">-</button>
            
            <button onclick="adicionar('1')">1</button>
            <button onclick="adicionar('2')">2</button>
            <button onclick="adicionar('3')">3</button>
            <button onclick="adicionar('+')">+</button>
            
            <button onclick="adicionar('0')">0</button>
            <button onclick="adicionar('.')">.</button>
            <button class="igual" onclick="calcular()" style="grid-column: span 2;">=</button>
        </div>
    </div>

    <script>
        let display = document.getElementById("display");

        function adicionar(valor) {
            display.value += valor;
        }

        function limpar() {
            display.value = "";
        }

        function apagar() {
            display.value = display.value.slice(0, -1);
        }

        function calcular() {
            try {
                display.value = eval(display.value);
            } catch (erro) {
                display.value = "Erro";
            }
        }
    </script>

</body>
</html>
