<!DOCTYPE html>
<html>
<head>
    <title>Adivinhe o Número</title>
    <style>
        body { font-family: Arial; text-align: center; margin-top: 50px; }
        #resultado { font-size: 24px; margin-top: 20px; }
        #tentativas { font-size: 18px; color: gray; margin-top: 10px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>

    <h1>🎯 Adivinhe o Número</h1>
    <p>Vou pensar em um número de 10 a 20. Tente adivinhar!</p>
    <button onclick="jogar()">Tentar Adivinhar</button>
    <p id="resultado"></p>
    <p id="tentativas"></p>

    <script>
        function jogar() {
            // Gera o número secreto entre 10 e 20
            let numeroSecreto = Math.floor(Math.random() * 11) + 10;
            
            // cria um contador de tentativas
            let tentativas = 0;
            let acertou = false;
            
            // loop que repete enquanto não acertar
            while (acertou === false) {
                tentativas = tentativas + 1;  // soma 1 no contador
                
                let palpiteTexto = prompt("Tentativa " + tentativas + " - Digite um número de 10 a 20:");
                let palpite = Number(palpiteTexto);
                
                if (palpite === numeroSecreto) {
                    acertou = true;  // sai do loop
                } else if (palpite < numeroSecreto) {
                    alert("⬆️ Errou! O número é MAIOR. Tenta de novo!");
                } else {
                    alert("⬇️ Errou! O número é MENOR. Tenta de novo!");
                }
            }
        
            // Mostra o resultado final
            let resultado = document.getElementById("resultado");
            resultado.innerText = "🎉 ACERTOU! O número era " + numeroSecreto;
            resultado.style.color = "green";
            
            let tentativasTexto = document.getElementById("tentativas");
            tentativasTexto.innerText = "Você acertou em " + tentativas + " tentativas!";
        }
    </script>

</body>
</html>
